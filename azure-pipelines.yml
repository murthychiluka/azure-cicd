trigger:
- main

variables:
- group: variablecall

- name: tag
  value: 'latest'

- name: app-name
  value: 'cloud-app'

- name: acrName
  value: 'murthy'

- name: acrrepo
  value: 'murthy.azurecr.io'

- name: azureServiceConnection
  value: 'azureconnect'

- name: sshConnection
  value: 'sshconnect'


pool:
  name: 'murthy'
  # vmImage: 'ubuntu-latest'

steps:

# ==========================================================
# STEP 1
# Azure DevOps Agent → WIF → ACR
# ==========================================================

- task: AzureCLI@2
  displayName: 'Build and Push Image to ACR'
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      echo "Azure authentication"
      az account show

      echo "Login to ACR"
      az acr login --name $(acrName)

      echo "Build Docker image"
      docker build \
        -t $(acrrepo)/$(app-name):$(tag) .

      echo "Push Docker image"
      docker push \
        $(acrrepo)/$(app-name):$(tag)

      echo "Image pushed successfully"


# ==========================================================
# STEP 2
# Azure DevOps → SSH → AWS EC2
# =========================================================

- task: SSH@0
  displayName: 'Deploy Application to EC2'
  inputs:
    sshEndpoint: '$(sshConnection)'
    runOptions: 'commands'
    commands: |
      echo "Login to ACR"

      mkdir -p /tmp/docker-config

      if printf '%s\n' '$(ACR_PASSWORD)' | docker --config /tmp/docker-config login murthy.azurecr.io --username '$(ACR_USERNAME)' --password-stdin 2>/dev/null; then
        echo "ACR login successful"
      else
        echo "ACR login failed"
        exit 1
      fi

      echo "Pulling image"
      docker --config /tmp/docker-config pull murthy.azurecr.io/$(app-name):$(tag)

      echo "Stopping old container"
      docker stop $(app-name) 2>/dev/null || true

      echo "Removing old container"
      docker rm $(app-name) 2>/dev/null || true
